name: Refresh news-only Wire
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: wire-runtime
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/test_news_wire.py
      - name: Refresh publisher headlines without model calls
        run: python scripts/build_news_wire.py --refresh-only
      - name: Bank the news snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news_wire.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh news-only Wire headlines'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Rebuild the public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref main -f skip_fetch=true
