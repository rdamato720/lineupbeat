name: Wire V3 story-first dark launch

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Evidence lookback in hours (1-48)"
        required: true
        default: "24"
      max_calls:
        description: "Maximum story decisions (1-40)"
        required: true
        default: "25"
      cap_usd:
        description: "Maximum estimated model spend (0-1 USD)"
        required: true
        default: "0.20"

concurrency:
  group: wire-v3-dark-launch
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
      SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      TAPI_DAILY_CAP: ${{ vars.WIRE_MOBILE_TAPI_DAILY_CAP_USD }}
      V3_HOURS: ${{ inputs.hours }}
      V3_MAX_CALLS: ${{ inputs.max_calls }}
      V3_CAP_USD: ${{ inputs.cap_usd }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            wire-v3-x.db
            wire-v3-state.json
          key: wire-v3-state-${{ github.run_id }}
          restore-keys: wire-v3-state-
      - name: Validate isolated limits
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal
          hours = float(os.environ["V3_HOURS"])
          calls = int(os.environ["V3_MAX_CALLS"])
          cap = Decimal(os.environ["V3_CAP_USD"])
          x_cap = Decimal(os.environ["TAPI_DAILY_CAP"])
          assert 1 <= hours <= 48 and 1 <= calls <= 40
          assert Decimal("0") < cap <= Decimal("1")
          assert Decimal("0") < x_cap <= Decimal("25")
          PY
      - name: Offline V3 quality gates
        run: |
          python scripts/test_wire_v3.py
          python scripts/test_wire_mobile.py
          python scripts/wire_health.py --check
      - name: Authenticate before source reads
        run: |
          python - <<'PY'
          from wire.v3_draft import OpenAIV3DraftProvider
          OpenAIV3DraftProvider().authenticate()
          print("Wire V3 provider authenticated; 0 Responses API calls")
          PY
      - name: Capture article and X evidence
        run: |
          python scripts/wire_backfill.py --discover --report --hours "$V3_HOURS"
          python scripts/wire_extract.py --limit 3000
          python scripts/wire_inclusive_review.py --hours "$V3_HOURS"
          python -m beatwire.cli --db wire-v3-x.db run --sport nfl --kind twitterapi \
            --capture-only --tapi-daily-cap "$TAPI_DAILY_CAP"
      - name: Review once per story
        run: |
          python scripts/wire_v3_draft.py --hours "$V3_HOURS" \
            --max-calls "$V3_MAX_CALLS" --cap "$V3_CAP_USD" --state wire-v3-state.json
          python scripts/wire_v3_inbox.py
      - name: Upload exact review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wire-v3-dark-${{ github.run_id }}
          path: |
            data/wire_v3_dark_batch.json
            data/wire_v3_dark_inbox.md
          if-no-files-found: error
      - name: Open review-only issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create wire-v3-dark --color 15803d \
            --description "Story-first review only; cannot publish" --force
          gh issue create --title "Wire V3 story-first dark launch — run ${{ github.run_number }}" \
            --body-file data/wire_v3_dark_inbox.md --label wire-v3-dark --assignee rdamato720
      - name: Save isolated V3 cursors
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            wire-v3-x.db
            wire-v3-state.json
          key: wire-v3-state-${{ github.run_id }}
