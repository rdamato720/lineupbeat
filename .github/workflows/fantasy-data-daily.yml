name: daily fantasy data refresh

on:
  schedule:
    # 6:00 a.m. Eastern during daylight-saving time; 5:00 a.m. in winter.
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  # Serialize source updates with the site refresh. No paid providers are called.
  group: wire-runtime
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  # Once this release reaches the default branch, the daily job updates the
  # production source and explicitly dispatches one production rebuild. A
  # push made with the workflow token does not trigger another workflow.
  FANTASY_DATA_BRANCH: main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.FANTASY_DATA_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: .cache/nfl-week2
          key: nfl-week2-${{ github.run_id }}
          restore-keys: nfl-week2-

      - name: Validate the daily refresh boundary
        run: |
          python scripts/test_odds_inputs.py
          python scripts/test_daily_fantasy_refresh.py
          python scripts/test_week1_intelligence.py
          python scripts/test_espn_injury_inputs.py

      - name: Refresh Week 2 inputs and build candidate
        run: |
          python scripts/capture_nfl_week2.py
          python scripts/build_nfl_week2.py --cache .cache/nfl-week2
          python scripts/test_nfl_week2.py

      - name: Verify generated readers
        run: |
          python scripts/test_decision_room.py
          python scripts/test_my_team.py
          python scripts/test_comparison_tool.py
          python scripts/test_odds_inputs.py
          python scripts/test_daily_fantasy_refresh.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/nfl-week2
          key: nfl-week2-${{ github.run_id }}

      - name: Publish validated data release
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_weekly/2026/week-2/v1.0/projections.json \
            data/nfl_weekly/2026/week-2/v1.0/provenance.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh daily fantasy projections and ranks"
          git pull --rebase origin "$FANTASY_DATA_BRANCH"
          git push origin "HEAD:$FANTASY_DATA_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild and deploy the changed production site
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref "$FANTASY_DATA_BRANCH" -f skip_fetch=true
