name: build development site

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: lineupbeat-development-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEV_PROJECT: lineupbeat-dev
      DEV_BASE_URL: https://lineupbeat-dev.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Development safety gates
        run: |
          python scripts/test_dev_site.py
          python scripts/test_resolve.py
          python scripts/test_player_pages.py
          python scripts/test_ranking_formats.py
          python scripts/test_comparison_tool.py
          python scripts/test_decision_room.py
          python scripts/test_comparison_engine_v2.py
          python scripts/test_visual_regressions.py
          python scripts/test_sport_experiences.py
          python scripts/test_college_decision_room.py
          python scripts/test_week1_intelligence.py
          python scripts/test_my_team.py
          node scripts/test_espn_roster_parser.js
          node scripts/test_espn_safe_diagnostics.js
          node scripts/test_my_team_browser.js
          python scripts/test_chrome_store_bundle.py
          python scripts/test_feedback.py
          python -m beatwire.cli doctor --sport nfl
          python scripts/sync_home_nav.py --check

      - name: Validate the trusted-current season release
        run: |
          python scripts/build_nfl_trusted_season.py
          python scripts/test_nfl_trusted_season.py

      - name: Build the complete offline development site twice
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/build_nfl_v15_development.py --development
          python scripts/verify_nfl_season_release.py site --manifest /tmp/trusted-build-one.json
          python scripts/build_nfl_v15_development.py --development
          python scripts/verify_nfl_season_release.py site --compare /tmp/trusted-build-one.json
          python scripts/verify_nfl_season_release.py site
          python scripts/verify_deploy_artifact.py site --decision-room
          python scripts/dev_site.py verify
          python scripts/test_site_unification.py site
          python scripts/test_college_week1.py

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineupbeat-development-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 7

      - name: Upload Chrome Web Store submission package
        uses: actions/upload-artifact@v4
        with:
          name: lineupbeat-espn-cws-submission-${{ github.run_id }}
          path: build/chrome-web-store/lineupbeat-espn-my-team-beta-0.2.6.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Chrome Web Store listing materials
        uses: actions/upload-artifact@v4
        with:
          name: lineupbeat-espn-cws-listing-${{ github.run_id }}
          path: build/chrome-web-store/listing-materials
          if-no-files-found: error
          retention-days: 14

      - name: Deploy only to the isolated development project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$DEV_PROJECT" = "lineupbeat-dev"
          npx --yes wrangler@latest pages project create "$DEV_PROJECT" \
            --production-branch=develop || true
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '/_' '--')
          npx --yes wrangler@latest pages deploy site \
            --project-name="$DEV_PROJECT" --branch="$branch" \
            --commit-dirty=true
