name: Publish approved mobile Wire cards

on:
  issue_comment:
    types: [created]

concurrency:
  group: wire-runtime
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor == 'rdamato720' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'wire-inbox')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Approval boundary gates
        run: |
          python scripts/test_wire_mobile.py
          python scripts/test_wire_review.py
          python scripts/wire_health.py --check

      - name: Apply exact authorized comment
        id: apply
        run: |
          python scripts/wire_mobile_approve.py \
            --event "$GITHUB_EVENT_PATH" --publish
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("data/wire_mobile_approval_result.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for key in ("approved", "rejected", "published", "remaining"):
                  output.write(f"{key}={result[key]}\n")
              output.write(f"close_issue={str(result['close_issue']).lower()}\n")
          PY

      - name: Rebuild and verify the approved Wire artifacts
        run: |
          python scripts/wire_homepage_replacement.py
          python scripts/test_wire.py
          python scripts/test_wire_page.py
          python scripts/test_wire_homepage.py
          python scripts/wire_health.py --check

      - name: Commit the approval receipt and publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wire_publications.json data/wire_publication_preview.json \
            data/wire_publication_preview.html data/wire_mobile_approvals.json \
            data/wire_mobile_approval_result.json \
            data/wire_homepage_replacement.json \
            data/wire_homepage_replacement.html data/wire_snapshots/
          git commit -m "Publish phone-approved Wire cards"
          git push origin HEAD:main

      - name: Confirm on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Applied: ${{ steps.apply.outputs.approved }} approved, ${{ steps.apply.outputs.rejected }} rejected, ${{ steps.apply.outputs.published }} published. ${{ steps.apply.outputs.remaining }} remain."

      - name: Close completed inbox
        if: steps.apply.outputs.close_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}"

      - name: Queue Wire-only page rebuild
        if: steps.apply.outputs.published != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh.yml --ref main \
            -f skip_fetch=true -f wire_review_mode=none
