name: refresh beat feed

on:
  # No GitHub schedule: cron-job.org triggers this via
  # workflow_dispatch. Both running meant two runs where
  # one was intended, and twice the API spend.
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/refresh.yml"
      - "data/wire_review_selection.json"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip the wire fetch and only rebuild pages"
        type: boolean
        default: false
      wire_review_mode:
        description: "Run a non-publishing Wire review batch instead of refresh"
        type: choice
        options:
          - none
          - plan
          - review
        default: none
      wire_review_hours:
        description: "Publisher-time discovery window for the review batch"
        type: choice
        options:
          - "48"
          - "72"
        default: "72"
      wire_candidate_ids:
        description: "Review mode only: comma/space-separated exact candidate ids"
        type: string
        default: ""

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.wire_review_mode == 'none' && 'refresh' || 'wire-review-batch' }}
  # Queue the next run. Do not cancel the one in flight.
  #
  # The hazard this group exists for is two runs overlapping: the cache only
  # saves when a job finishes, so the second restores a database from before
  # the first did any work, sees the same articles as unseen, and pays to
  # extract them again. Cancelling is not what prevents that -- not
  # overlapping is, and queueing does it without throwing work away. At most
  # one run sits pending here, so a third trigger displaces the pending one,
  # which has done nothing and cost nothing.
  #
  # Cancelling mid-run was expensive in a way that did not show up as a
  # failure. The loop in pipeline.py polls sources in file order, so a run
  # killed partway always dies in the same place: every X call it had
  # already made was billed, the database was never saved, and the bottom of
  # sources/nfl.yaml was polled a fraction as often as the top. One day's
  # spend table showed two full passes over the first 75 sources and 22
  # sources never polled at all.
  cancel-in-progress: false

jobs:
  wire-review-batch:
    if: github.event_name == 'pull_request' || inputs.wire_review_mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      WIRE_REVIEW_HOURS: ${{ inputs.wire_review_hours || '72' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The review resolver compares the PR to its base so an old paid
          # selection cannot be replayed by an unrelated code change.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve and validate review request
        id: review_request
        env:
          DISPATCH_MODE: ${{ inputs.wire_review_mode }}
          DISPATCH_CANDIDATE_IDS: ${{ inputs.wire_candidate_ids }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          mode = os.environ.get("DISPATCH_MODE") or "plan"
          candidate_ids = os.environ.get("DISPATCH_CANDIDATE_IDS", "")
          selection_path = Path("data/wire_review_selection.json")
          selection_changed = False
          if (os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
                  and selection_path.exists()):
              base_sha = os.environ.get("PR_BASE_SHA", "")
              if not re.fullmatch(r"[0-9a-f]{40}", base_sha):
                  raise SystemExit("pull request has no valid base SHA; 0 API calls")
              changed = subprocess.run(
                  ["git", "diff", "--quiet", base_sha, "HEAD", "--",
                   str(selection_path)], check=False)
              if changed.returncode not in (0, 1):
                  raise SystemExit(
                      "could not verify the review-selection diff; 0 API calls")
              selection_changed = changed.returncode == 1
          if (os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
                  and selection_changed):
              selection = json.loads(selection_path.read_text())
              required = {
                  "schema_version": "wire-review-selection-v1",
                  "approved_by": "Ralph Damato",
                  "approval_statement": "approved",
                  "approved_cost_usd": 1.0,
                  "approved_max_calls": 40,
                  "generator_cap_usd": 0.40,
                  "generator_max_calls": 20,
                  "reviewer_cap_usd": 0.40,
                  "reviewer_max_calls": 20,
                  "hours": 72,
              }
              bad = [key for key, value in required.items()
                     if selection.get(key) != value]
              ids = selection.get("candidate_ids")
              if bad:
                  raise SystemExit(f"selection authorization mismatch: {bad}; 0 API calls")
              if not isinstance(selection.get("plan_run_id"), int):
                  raise SystemExit("selection has no integer plan_run_id; 0 API calls")
              if not re.fullmatch(r"[0-9a-f]{64}", selection.get("plan_digest", "")):
                  raise SystemExit("selection has no valid plan digest; 0 API calls")
              if not isinstance(ids, list) or not 1 <= len(ids) <= 20:
                  raise SystemExit("selection requires 1-20 candidate ids; 0 API calls")
              if any(not isinstance(value, str) or
                     not re.fullmatch(r"[0-9a-f]{20}", value) for value in ids):
                  raise SystemExit("selection has an invalid candidate id; 0 API calls")
              if len(set(ids)) != len(ids):
                  raise SystemExit("selection repeats a candidate id; 0 API calls")
              candidate_ids = " ".join(ids)
              paths = {
                  "paid": Path("data/wire_paid_candidates.json"),
                  "state": Path("data/wire_backfill.json"),
                  "independent": Path("data/wire_independent_review.json"),
                  "package": Path("data/wire_review_package.json"),
              }
              banked = False
              if all(path.exists() for path in paths.values()):
                  paid = json.loads(paths["paid"].read_text())
                  state = json.loads(paths["state"].read_text())
                  independent = json.loads(paths["independent"].read_text())
                  package = json.loads(paths["package"].read_text())
                  generator = state.get("openai") or {}
                  generated_ids = [
                      (item.get("candidate") or {}).get("candidate_id")
                      for item in state.get("results", [])
                  ]
                  reviewed_ids = [
                      (item.get("candidate") or {}).get("candidate_id")
                      for item in independent.get("items", [])
                  ]
                  packaged_ids = [
                      (item.get("candidate") or {}).get("candidate_id")
                      for item in package.get("items", [])
                  ]
                  calls = int(generator.get("calls", 0)) + int(independent.get("calls", 0))
                  cost = float(generator.get("cost_usd", 0)) + float(independent.get("cost_usd", 0))
                  publication_sha = hashlib.sha256(
                      Path("data/wire_publications.json").read_bytes()).hexdigest()
                  banked = all((
                      set(ids).issubset(set(paid.get("candidate_ids") or [])),
                      generated_ids == ids,
                      len(reviewed_ids) == len(ids) and set(reviewed_ids) == set(ids),
                      len(packaged_ids) == len(ids) and set(packaged_ids) == set(ids),
                      not generator.get("provider_failures"),
                      int(generator.get("calls", 0)) <= 20,
                      float(generator.get("cost_usd", 0)) <= 0.40,
                      int(independent.get("calls", 0)) <= 20,
                      float(independent.get("cost_usd", 0)) <= 0.40,
                      calls <= 40,
                      cost <= 1.00,
                      independent.get("publications_applied") == 0,
                      package.get("publications_applied") == 0,
                      publication_sha == selection.get("publication_sha256_before"),
                  ))
              mode = "banked" if banked else "review"
          elif os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              # An authorization committed for an earlier cohort is not a
              # standing approval to spend again on every later code PR.
              mode = "check"
          if mode not in {"plan", "review", "banked", "check"}:
              raise SystemExit(f"invalid review mode {mode!r}; 0 API calls")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"mode={mode}\n")
              output.write(f"candidate_ids={candidate_ids}\n")
          print(f"review request: {mode}")
          PY

      - name: Review boundary gates
        run: |
          python scripts/test_wire_review.py
          python scripts/wire_health.py --check

      - name: Verify review provider before discovery
        if: steps.review_request.outputs.mode == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          from wire.providers.openai import OpenAISemanticProvider
          from wire.providers.openai_review import OpenAIIndependentReviewer

          generator = OpenAISemanticProvider()
          reviewer = OpenAIIndependentReviewer()
          if not generator.available() or not reviewer.available():
              raise SystemExit("OPENAI_API_KEY is unavailable; 0 API calls, discovery not started")
          generator.authenticate()
          OpenAISemanticProvider(model=reviewer.model).authenticate()
          print("review providers authenticated; 0 Responses API calls")
          PY

      - name: Clear stale review outputs from the runner
        if: steps.review_request.outputs.mode != 'banked' && steps.review_request.outputs.mode != 'check'
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "data/wire_backfill_plan.json",
              "data/wire_independent_review.json",
              "data/wire_review_package.json",
              "data/wire_review_package.html",
          ):
              Path(name).unlink(missing_ok=True)
          PY

      - name: Record publication boundary
        id: publications
        run: |
          echo "sha=$(sha256sum data/wire_publications.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Discover current evidence
        if: steps.review_request.outputs.mode != 'banked' && steps.review_request.outputs.mode != 'check'
        run: |
          python scripts/wire_backfill.py --discover --report \
            --hours "$WIRE_REVIEW_HOURS"

      - name: Extract deterministic evidence candidates
        if: steps.review_request.outputs.mode != 'banked' && steps.review_request.outputs.mode != 'check'
        run: |
          python scripts/wire_extract.py --limit 1000

      - name: Build zero-call plan
        if: steps.review_request.outputs.mode == 'plan'
        run: |
          python scripts/wire_backfill.py --plan --report \
            --hours "$WIRE_REVIEW_HOURS"

      - name: Interpret exact approved cohort
        if: steps.review_request.outputs.mode == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WIRE_CANDIDATE_IDS: ${{ steps.review_request.outputs.candidate_ids }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          candidate_ids = [
              value for value in re.split(r"[\s,]+", os.environ["WIRE_CANDIDATE_IDS"].strip())
              if value
          ]
          if not 1 <= len(candidate_ids) <= 20:
              raise SystemExit("review mode requires 1-20 exact candidate ids; 0 API calls")
          invalid = [value for value in candidate_ids
                     if not re.fullmatch(r"[0-9a-f]{20}", value)]
          if invalid:
              raise SystemExit(f"invalid candidate ids {invalid}; 0 API calls")
          if len(set(candidate_ids)) != len(candidate_ids):
              raise SystemExit("duplicate candidate ids; 0 API calls")

          command = [sys.executable, "scripts/wire_backfill.py",
                     "--interpret", "--report",
                     "--hours", os.environ["WIRE_REVIEW_HOURS"],
                     "--cap", "0.40", "--max-calls", "20"]
          for candidate_id in candidate_ids:
              command.extend(("--candidate-id", candidate_id))
          completed = subprocess.run(command, check=False)
          if completed.returncode:
              raise SystemExit(completed.returncode)

          import json
          from pathlib import Path

          state = json.loads(Path("data/wire_backfill.json").read_text())
          generator = state.get("openai") or {}
          result_ids = [
              (item.get("candidate") or {}).get("candidate_id")
              for item in state.get("results", [])
          ]
          if generator.get("provider_failures"):
              raise SystemExit("generator provider failure; independent review refused")
          if result_ids != candidate_ids:
              raise SystemExit(
                  "generator did not complete the exact approved cohort; "
                  "independent review refused"
              )
          PY

      - name: Independently review exact cohort
        if: steps.review_request.outputs.mode == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/wire_independent_review.py --cap 0.40 --max-calls 20
          python scripts/wire_review_package.py

      - name: Enforce approved total limits and non-publication
        if: steps.review_request.outputs.mode == 'review'
        env:
          PUBLICATIONS_BEFORE: ${{ steps.publications.outputs.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("data/wire_backfill.json").read_text())
          independent = json.loads(Path("data/wire_independent_review.json").read_text())
          package = json.loads(Path("data/wire_review_package.json").read_text())
          generator = state.get("openai") or {}
          calls = int(generator.get("calls", 0)) + int(independent.get("calls", 0))
          cost = float(generator.get("cost_usd", 0)) + float(independent.get("cost_usd", 0))
          selected = json.loads(Path("data/wire_review_selection.json").read_text())
          selected_ids = selected.get("candidate_ids") or []
          generated_ids = [(item.get("candidate") or {}).get("candidate_id")
                           for item in state.get("results", [])]
          reviewed_ids = [(item.get("candidate") or {}).get("candidate_id")
                          for item in independent.get("items", [])]
          if generated_ids != selected_ids or reviewed_ids != selected_ids:
              raise SystemExit("refused: exact approved cohort is incomplete")
          if int(generator.get("calls", 0)) > 20 or float(generator.get("cost_usd", 0)) > 0.40:
              raise SystemExit("refused: generator exceeded its approved boundary")
          if int(independent.get("calls", 0)) > 20 or float(independent.get("cost_usd", 0)) > 0.40:
              raise SystemExit("refused: independent reviewer exceeded its approved boundary")
          if calls > 40:
              raise SystemExit(f"refused: {calls} calls exceeds approved limit 40")
          if cost > 1.00:
              raise SystemExit(f"refused: ${cost:.4f} exceeds approved limit $1.00")
          if package.get("publications_applied") != 0:
              raise SystemExit("refused: review package reports publications")
          path = Path("data/wire_publications.json")
          after = hashlib.sha256(path.read_bytes()).hexdigest()
          if after != os.environ["PUBLICATIONS_BEFORE"]:
              raise SystemExit("refused: publication file changed during review batch")
          print(f"approved boundary held: {calls}/40 calls, ${cost:.4f}/$1.00, 0 published")
          PY

      - name: Confirm plan made no paid calls or publications
        if: steps.review_request.outputs.mode == 'plan'
        env:
          PUBLICATIONS_BEFORE: ${{ steps.publications.outputs.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("data/wire_backfill_plan.json").read_text())
          if plan.get("model_calls_made") != 0:
              raise SystemExit("plan unexpectedly reports model calls")
          after = hashlib.sha256(Path("data/wire_publications.json").read_bytes()).hexdigest()
          if after != os.environ["PUBLICATIONS_BEFORE"]:
              raise SystemExit("publication file changed during plan")
          print(f"plan boundary held: {plan['count']} candidates, 0 calls, 0 published")
          PY

      - name: Confirm code-only check made no calls or publications
        if: steps.review_request.outputs.mode == 'check'
        env:
          PUBLICATIONS_BEFORE: ${{ steps.publications.outputs.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          after = hashlib.sha256(
              Path("data/wire_publications.json").read_bytes()).hexdigest()
          if after != os.environ["PUBLICATIONS_BEFORE"]:
              raise SystemExit("publication file changed during code-only check")
          print("code-only boundary held: 0 provider calls, 0 model calls, 0 published")
          PY

      - name: Confirm banked review receipt
        if: steps.review_request.outputs.mode == 'banked'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/wire_backfill.json").read_text())
          independent = json.loads(Path("data/wire_independent_review.json").read_text())
          generator = state["openai"]
          calls = generator["calls"] + independent["calls"]
          cost = generator["cost_usd"] + independent["cost_usd"]
          print(f"banked receipt valid: {calls}/40 calls, ${cost:.4f}/$1.00, 0 published")
          PY

      - name: Bank review ledger and artifacts on this branch
        if: github.event_name == 'workflow_dispatch' && steps.review_request.outputs.mode == 'review'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wire_paid_candidates.json data/wire_backfill.json \
            data/wire_independent_review.json data/wire_review_package.json \
            data/wire_review_package.html
          if git diff --cached --quiet; then
            echo "No review artifacts changed"
          else
            git commit -m "Bank expanded Wire review batch"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload review-only artifacts
        if: always() && steps.review_request.outputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: wire-${{ steps.review_request.outputs.mode }}-${{ github.run_id }}
          path: |
            data/wire_backfill.json
            data/wire_backfill_plan.json
            data/wire_paid_candidates.json
            data/wire_independent_review.json
            data/wire_review_package.json
            data/wire_review_package.html
          if-no-files-found: warn
          retention-days: 30

  refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.wire_review_mode == 'none'
    runs-on: ubuntu-latest
    # Nothing displaces a running job now, so a hung one would hold the queue
    # until the six-hour default. Shorter than the two-hour trigger interval
    # would cut healthy runs short; this bounds the damage without doing that.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # seen_items is what stops you re-paying the model for an article you
      # already processed. Losing this cache costs real money, so it is keyed
      # to restore from the most recent run rather than rebuilt.
      - uses: actions/cache/restore@v4
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}
          restore-keys: beatwire-db-

      - name: Gates
        run: |
          python scripts/test_resolve.py
          python scripts/test_tapi.py
          # The semantic review path is a publication boundary. This focused
          # suite catches stale per-card identity, evidence/request hash
          # mixing, rolling-page timestamps and claim-subject enforcement.
          python scripts/test_wire_review.py
          python -m beatwire.cli doctor --sport nfl
          # The homepage header is generated from seo.py. If somebody edits
          # the template by hand instead, the app and the eight static
          # builders start showing different menus -- which is the whole
          # reason the nav was consolidated. Fails loudly rather than
          # deploying two headers.
          python scripts/sync_home_nav.py --check

      - name: Run pipeline
        env:
          # Both Recent News extraction and editorial Wire review use OpenAI.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Which provider reads X. Unset means twitterapi, so
          # removing this variable is the whole rollback.
          BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          # Rosters first, once a day.
          #
          # The wire always knows before the roster does -- that is the point
          # of reading beat writers -- so a player who signs today is
          # unresolvable until Sleeper catches up. Stefon Diggs signed with
          # Washington and five reports about him carried no position, so the
          # skill filter dropped him and his video never showed, on the one
          # day anybody wanted it.
          if [ "$(date -u +%H)" -lt 12 ]; then
            python scripts/import_rosters.py nfl || true
            python scripts/import_adp.py || true
            python scripts/import_depth.py --season 2026 || true
            # Scores fill in as games are played, so the same fetch keeps
            # strength of schedule current without any other trigger.
            python scripts/import_schedule.py --seasons 2025 2026 || true
          fi

          # The fetch is the only part that costs money, so a manual run
          # testing a page change can skip it and rebuild from whatever the
          # database already holds.
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            echo "  skip_fetch: not fetching, rebuilding pages only"
          else
            # A wrong claim, removed before anything is published.
          #
          # Reiss files preseason summaries where an ambulance emoji marks
          # the injured, and the extraction read the pictogram as "Carted
          # off during the game" -- a specific claim his text never makes,
          # published under his name. Deleting it here rather than by hand
          # because the database lives in the cache, not the repo.
          #
          # Remove this step once the extraction no longer produces it.
          python scripts/purge.py --claim "Carted off during the game." \
                 --yes || true

          python -m beatwire.cli run    --sport nfl
          fi

          # Everything still unmatched gets another try against the roster as
          # it stands now. No model call, so this is free.
          python scripts/reresolve.py --sport nfl || true
          python -m beatwire.cli export --sports nfl \
                 --out site/data/feed.json --site site/index.html
          # Crawlable pages. The app is one hash-routed URL with no words in
          # the markup; these give search engines a real address per player
          # with the reporting already in the HTML.
          # Strength of schedule, recomputed from whatever has been played.
          # Before build_pages, because the hub links to it.
          python scripts/schedule_strength.py --season 2026 --quiet || true
          # Player pages first: the boards link to
          # /nfl/<slug>/ and only do so where that directory
          # exists. Running this last is why the live board
          # shipped 614 plain names while a laptop linked
          # 603 -- a laptop had the directories already.
          # The board first, so the page builder knows which
          # 614 players need a page. Without it the first
          # pass only covers players with reports, the board
          # links to whoever happens to exist, and the pages
          # created afterwards arrive too late to be linked.
          python scripts/build_projections.py \
                 data/projections.xlsx || true

          python scripts/build_pages.py --base https://lineupbeat.com

          # Rankings. After the first page pass, because the board only
          # links to /nfl/<slug>/ where that directory already exists, and
          # before the second, because the hub card previews the JSON this
          # writes and the sitemap needs the five URLs.
          #
          # The failure is annotated, not swallowed, and not fatal. A trade
          # worth stating plainly:
          #
          # The builder enforces thirteen published rules and exits non-zero
          # on any of them, so invalid rankings never publish. That part is
          # not optional and is not what this line decides. What it decides
          # is whether a rankings data problem also stops the wire, the
          # projections and the deploy, and it should not -- the same
          # reasoning as the preflight step below.
          #
          # `::error::` rather than `|| true`: a silent skip is how a page
          # goes stale for a week and looks like a quiet news day. This puts
          # a red annotation on the run summary while the site still ships.
          # Drop the `||` clause to make a gate failure stop everything.
          python scripts/build_rankings.py \
            || echo "::error title=Rankings not published::build_rankings.py failed its validation gates. The published board is unchanged."

          python scripts/build_sos.py || true

          # Projections, from the committed workbook. site/nfl is gitignored
          # and rebuilt here, so a page built locally never reaches Netlify:
          # if this step does not run, the projections page does not exist in
          # production however many times it is built on a laptop.
          python scripts/build_projections.py \
                 data/projections.xlsx || true

          # Coaching. A flat file that changes when a staff does, so this is
          # cheap and keeps the page in the deploy rather than only on a
          # laptop -- site/nfl is gitignored and rebuilt here.
          python scripts/build_coaching.py || true
          python scripts/import_rushing.py --seasons 2025 \
                 --rbwr data/rbwr_2025.csv || true
          python scripts/build_ol_rb.py --season 2025 || true

          # What changed in the projections, from the workbook's own
          # Weekly Update tab. Skips itself when the tab is absent.
          python scripts/build_changes.py || true

          # Draft value. After the ADP import above, because it reads the
          # same canonical number the durability board does -- one figure
          # read twice rather than two that happen to agree today.
          python scripts/build_draft_value.py || true

          # College projections, from the frozen release under
          # data/college. Deliberately without `|| true`: the builder
          # verifies the release manifest against a pinned SHA, and
          # swallowing that failure would publish a release nobody
          # reviewed, which is the one thing the gate exists to stop.
          python scripts/build_college_projections.py

          # Unmatched paths fell through to the homepage, so a mistyped
          # URL rendered the front page under it and read as a soft 404.
          python scripts/build_404.py

          # The YouTube pilot is paused in production, so nothing runs here.
          # sources/wire_youtube.yaml carries `paused: true`; the adapters,
          # the budget, the cached transcripts and their tests all stay in
          # the repository. Website reporting is the launch priority.

          # The editorial Wire, and deliberately without `|| true`.
          #
          # This step validates data/wire_publications.json before it writes
          # anything: every record must carry a reviewer approval, a fantasy
          # position, a direction whose reader label agrees with it, an https
          # source link, and evidence and commentary in separate fields. A
          # record in any held state -- PENDING, HOLD, ABSTAIN,
          # NO_FANTASY_IMPACT, REJECTED, SUPERSEDED -- fails the build rather
          # than being skipped, because a page that renders what it can and
          # drops the rest publishes a silent subset and nobody finds out.
          #
          # Failing here stops the job before Deploy, which is the point.
          # It runs after build_404 so site/index.html exists for the
          # homepage module, and before build_pages so the sitemap includes
          # /nfl/wire/.
          python scripts/build_wire.py --base https://lineupbeat.com

          # The homepage replacement, applied to the generated homepage.
          #
          # It removes the retired X-report collection from the payload
          # rather than only hiding its renderer -- a hidden report about a
          # player a reviewer rejected is still shipped to the reader --
          # while keeping the roster rows that carry photo ids, team codes
          # and ADP for search, My Roster and the card badges. The feed
          # itself stays in site/data/feed.json and in source control, so a
          # rollback restores it.
          python scripts/wire_homepage_replacement.py --apply

          # Again, so the projection chips read the board that
          # was just rebuilt. Last, so the sitemap it writes includes
          # the college URLs added above.
          python scripts/build_pages.py --base https://lineupbeat.com

          # Last, and against the directory wrangler uploads rather than the
          # build that produced it.
          #
          # /nfl/wire/ was built correctly and then deleted by build_pages,
          # which prunes stale player directories under site/<sport>/ and did
          # not know "wire" was a section. Every check up to that point read
          # the builder's output and passed; the homepage shipped with three
          # links to a page that no longer existed on disk. A build-time
          # check cannot see that. This one reads the artifact.
          python scripts/verify_deploy_artifact.py site


      # The database, banked whatever happened above.
      #
      # Directly after the step that writes it, and deliberately not at the
      # end of the job: beatwire.db only changes in the pipeline step, and
      # every minute between the work and the save is a minute a
      # cancellation can throw it away. `always()` runs on cancellation,
      # which is the case this exists for -- a killed run has already paid
      # the model for whatever it extracted before it died, and pipeline.py
      # commits per source, so there is always real work to keep.
      - name: Save the database, whatever happened
        if: always()
        uses: actions/cache/save@v4
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}

      # A daily snapshot of the database, kept off the critical path.
      #
      # The cache is otherwise the only copy that exists. It is not in the
      # repository, it is not on anyone's laptop, and GitHub drops a cache
      # nothing has touched for seven days. "Derived data" undersells what
      # would be lost: it was derived from posts that scroll away, a beat
      # writer's timeline goes back a few hundred tweets and then it is gone,
      # and the player pages are built from what was captured before that
      # happened. Losing it is losing the archive.
      #
      # Once a day, not every run. Twelve 20MB uploads a day is noise on the
      # run log and minutes on the clock for no more safety than one. Runs are
      # two hours apart, so a two-hour window catches exactly one of them
      # whichever phase the trigger happens to be on.
      - name: Snapshot the database
        if: always()
        id: snap
        run: |
          if [ ! -f beatwire.db ]; then
            echo "  no database to snapshot"
            exit 0
          fi
          hour=$(date -u +%H)
          if [ "$hour" -ge 6 ] && [ "$hour" -lt 8 ]; then
            gzip -c beatwire.db > "beatwire-$(date -u +%Y-%m-%d).db.gz"
            ls -lh beatwire-*.db.gz
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "  not the daily snapshot window (hour $hour UTC)"
          fi

      - name: Upload the database snapshot
        if: always() && steps.snap.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beatwire-db
          path: beatwire-*.db.gz
          # Thirty days of daily copies at ~20MB, and free on a public repo.
          retention-days: 30
          # Already gzipped; compressing it again buys nothing and costs time.
          compression-level: 0

      # Publishes even if preflight warns, but records the verdict in the log
      # so a slow degradation shows up in run history instead of silently.
      - name: Preflight
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Which provider reads X. Unset means twitterapi, so
          # removing this variable is the whole rollback.
          BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python -m beatwire.cli preflight --sport nfl

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Cloudflare Pages rather than Netlify. Netlify moved to credit
        # billing and ten deploys a day exhausted them, most shipping a
        # rebuilt page where nothing had changed. Pages allows 500 builds a
        # month and unlimited bandwidth free.
        # Create first, deploy second. Wrangler no longer creates a
        # Pages project on deploy -- it errors and suggests Workers -- and
        # creating one that exists is a harmless failure, so this is a
        # no-op on every run after the first.
        run: |
          # Folded and labelled, because it fails on every run after the
          # first with "A project with this name already exists" and prints
          # a full ERROR block to do it. That block is the loudest thing in
          # a failed log and it is never the reason the job failed, which
          # is exactly how it gets read as the cause.
          echo "::group::Ensure the Pages project exists (expected to fail once it does)"
          npx --yes wrangler@latest pages project create lineupbeat \
              --production-branch=main || true
          echo "::endgroup::"

          # The deploy itself gets three attempts.
          #
          # It failed with "A fetch request failed, likely due to a
          # connectivity issue" and then "fetch failed" -- the runner could
          # not reach the Cloudflare API. Nothing was wrong with the build:
          # the pages had been written, the gates had passed, and the whole
          # run was thrown away by one network blip on the last step.
          #
          # A Pages deploy creates a new deployment each time, so a retry
          # after a failed upload costs a deployment slot and nothing else.
          for attempt in 1 2 3; do
            if npx --yes wrangler@latest pages deploy site \
                 --project-name=lineupbeat --branch=main --commit-dirty=true; then
              echo "  deployed on attempt $attempt"
              exit 0
            fi
            echo "  attempt $attempt failed"
            # An `if`, not `[ ] && sleep`: the runner sets -e, and on the
            # last pass the test fails, the && short-circuits, and the loop
            # body exits non-zero before the message below is ever printed.
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          echo "  three attempts failed. The build is fine; the Cloudflare"
          echo "  API was not reachable. Re-run the job."
          exit 1
