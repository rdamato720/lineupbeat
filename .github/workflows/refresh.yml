name: refresh beat feed

on:
  # No GitHub schedule: cron-job.org triggers this via
  # workflow_dispatch. Both running meant two runs where
  # one was intended, and twice the API spend.
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip the wire fetch and only rebuild pages"
        type: boolean
        default: false

concurrency:
  group: refresh
  # Cancel a run that is still going when the next one is due.
  #
  # The cache only saves when a job finishes, so an overlapping run restores
  # a database from before the run ahead of it did any work -- it sees the
  # same articles as unseen and pays to extract them all over again. Better
  # to abandon the older run: the newer one covers the same feeds anyway.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # seen_items is what stops you re-paying the model for an article you
      # already processed. Losing this cache costs real money, so it is keyed
      # to restore from the most recent run rather than rebuilt.
      - uses: actions/cache@v4
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}
          restore-keys: beatwire-db-

      - name: Gates
        run: |
          python scripts/test_resolve.py
          python -m beatwire.cli doctor --sport nfl

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which provider reads X. Unset means twitterapi, so
          # removing this variable is the whole rollback.
          BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          # Rosters first, once a day.
          #
          # The wire always knows before the roster does -- that is the point
          # of reading beat writers -- so a player who signs today is
          # unresolvable until Sleeper catches up. Stefon Diggs signed with
          # Washington and five reports about him carried no position, so the
          # skill filter dropped him and his video never showed, on the one
          # day anybody wanted it.
          if [ "$(date -u +%H)" -lt 12 ]; then
            python scripts/import_rosters.py nfl || true
            python scripts/import_adp.py || true
            python scripts/import_depth.py --season 2026 || true
            # Scores fill in as games are played, so the same fetch keeps
            # strength of schedule current without any other trigger.
            python scripts/import_schedule.py --seasons 2025 2026 || true
          fi

          # The fetch is the only part that costs money, so a manual run
          # testing a page change can skip it and rebuild from whatever the
          # database already holds.
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            echo "  skip_fetch: not fetching, rebuilding pages only"
          else
            python -m beatwire.cli run    --sport nfl
          fi

          # Everything still unmatched gets another try against the roster as
          # it stands now. No model call, so this is free.
          python scripts/reresolve.py --sport nfl || true
          python -m beatwire.cli export --sports nfl \
                 --out site/data/feed.json --site site/index.html
          # Crawlable pages. The app is one hash-routed URL with no words in
          # the markup; these give search engines a real address per player
          # with the reporting already in the HTML.
          # Strength of schedule, recomputed from whatever has been played.
          # Before build_pages, because the hub links to it.
          python scripts/schedule_strength.py --season 2026 --quiet || true
          # Player pages first: the boards link to
          # /nfl/<slug>/ and only do so where that directory
          # exists. Running this last is why the live board
          # shipped 614 plain names while a laptop linked
          # 603 -- a laptop had the directories already.
          # The board first, so the page builder knows which
          # 614 players need a page. Without it the first
          # pass only covers players with reports, the board
          # links to whoever happens to exist, and the pages
          # created afterwards arrive too late to be linked.
          python scripts/build_projections.py \
                 data/projections.xlsx || true

          python scripts/build_pages.py --base https://lineupbeat.com

          python scripts/build_sos.py || true

          # Projections, from the committed workbook. site/nfl is gitignored
          # and rebuilt here, so a page built locally never reaches Netlify:
          # if this step does not run, the projections page does not exist in
          # production however many times it is built on a laptop.
          python scripts/build_projections.py \
                 data/projections.xlsx || true

          # Coaching. A flat file that changes when a staff does, so this is
          # cheap and keeps the page in the deploy rather than only on a
          # laptop -- site/nfl is gitignored and rebuilt here.
          python scripts/build_coaching.py || true

          # What changed in the projections, from the workbook's own
          # Weekly Update tab. Skips itself when the tab is absent.
          python scripts/build_changes.py || true

          # Draft value. After the ADP import above, because it reads the
          # same canonical number the durability board does -- one figure
          # read twice rather than two that happen to agree today.
          python scripts/build_draft_value.py || true

          # Again, so the projection chips read the board that
          # was just rebuilt.
          python scripts/build_pages.py --base https://lineupbeat.com


      # Publishes even if preflight warns, but records the verdict in the log
      # so a slow degradation shows up in run history instead of silently.
      - name: Preflight
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which provider reads X. Unset means twitterapi, so
          # removing this variable is the whole rollback.
          BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python -m beatwire.cli preflight --sport nfl

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --dir=site --prod
