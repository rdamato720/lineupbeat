name: refresh beat feed

on:
  # No GitHub schedule: cron-job.org triggers this via
  # workflow_dispatch. Both running meant two runs where
  # one was intended, and twice the API spend.
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip the wire fetch and only rebuild pages"
        type: boolean
        default: false

concurrency:
  group: refresh
  # Queue the next run. Do not cancel the one in flight.
  #
  # The hazard this group exists for is two runs overlapping: the cache only
  # saves when a job finishes, so the second restores a database from before
  # the first did any work, sees the same articles as unseen, and pays to
  # extract them again. Cancelling is not what prevents that -- not
  # overlapping is, and queueing does it without throwing work away. At most
  # one run sits pending here, so a third trigger displaces the pending one,
  # which has done nothing and cost nothing.
  #
  # Cancelling mid-run was expensive in a way that did not show up as a
  # failure. The loop in pipeline.py polls sources in file order, so a run
  # killed partway always dies in the same place: every X call it had
  # already made was billed, the database was never saved, and the bottom of
  # sources/nfl.yaml was polled a fraction as often as the top. One day's
  # spend table showed two full passes over the first 75 sources and 22
  # sources never polled at all.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Nothing displaces a running job now, so a hung one would hold the queue
    # until the six-hour default. Shorter than the two-hour trigger interval
    # would cut healthy runs short; this bounds the damage without doing that.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # seen_items is what stops you re-paying the model for an article you
      # already processed. Losing this cache costs real money, so it is keyed
      # to restore from the most recent run rather than rebuilt.
      - uses: actions/cache/restore@v4
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}
          restore-keys: beatwire-db-

      - name: Gates
        run: |
          python scripts/test_resolve.py
          python scripts/test_tapi.py
          python -m beatwire.cli doctor --sport nfl
          # The homepage header is generated from seo.py. If somebody edits
          # the template by hand instead, the app and the eight static
          # builders start showing different menus -- which is the whole
          # reason the nav was consolidated. Fails loudly rather than
          # deploying two headers.
          python scripts/sync_home_nav.py --check

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which provider reads X. Unset means twitterapi, so
          # removing this variable is the whole rollback.
          BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          # Rosters first, once a day.
          #
          # The wire always knows before the roster does -- that is the point
          # of reading beat writers -- so a player who signs today is
          # unresolvable until Sleeper catches up. Stefon Diggs signed with
          # Washington and five reports about him carried no position, so the
          # skill filter dropped him and his video never showed, on the one
          # day anybody wanted it.
          if [ "$(date -u +%H)" -lt 12 ]; then
            python scripts/import_rosters.py nfl || true
            python scripts/import_adp.py || true
            python scripts/import_depth.py --season 2026 || true
            # Scores fill in as games are played, so the same fetch keeps
            # strength of schedule current without any other trigger.
            python scripts/import_schedule.py --seasons 2025 2026 || true
          fi

          # The fetch is the only part that costs money, so a manual run
          # testing a page change can skip it and rebuild from whatever the
          # database already holds.
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            echo "  skip_fetch: not fetching, rebuilding pages only"
          else
            # A wrong claim, removed before anything is published.
          #
          # Reiss files preseason summaries where an ambulance emoji marks
          # the injured, and the extraction read the pictogram as "Carted
          # off during the game" -- a specific claim his text never makes,
          # published under his name. Deleting it here rather than by hand
          # because the database lives in the cache, not the repo.
          #
          # Remove this step once the extraction no longer produces it.
          python scripts/purge.py --claim "Carted off during the game." \
                 --yes || true

          python -m beatwire.cli run    --sport nfl
          fi

          # Everything still unmatched gets another try against the roster as
          # it stands now. No model call, so this is free.
          python scripts/reresolve.py --sport nfl || true
          python -m beatwire.cli export --sports nfl \
                 --out site/data/feed.json --site site/index.html
          # Crawlable pages. The app is one hash-routed URL with no words in
          # the markup; these give search engines a real address per player
          # with the reporting already in the HTML.
          # Strength of schedule, recomputed from whatever has been played.
          # Before build_pages, because the hub links to it.
          python scripts/schedule_strength.py --season 2026 --quiet || true
          # Player pages first: the boards link to
          # /nfl/<slug>/ and only do so where that directory
          # exists. Running this last is why the live board
          # shipped 614 plain names while a laptop linked
          # 603 -- a laptop had the directories already.
          # The board first, so the page builder knows which
          # 614 players need a page. Without it the first
          # pass only covers players with reports, the board
          # links to whoever happens to exist, and the pages
          # created afterwards arrive too late to be linked.
          python scripts/build_projections.py \
                 data/projections.xlsx || true

          python scripts/build_pages.py --base https://lineupbeat.com

          # Rankings. After the first page pass, because the board only
          # links to /nfl/<slug>/ where that directory already exists, and
          # before the second, because the hub card previews the JSON this
          # writes and the sitemap needs the five URLs.
          #
          # The failure is annotated, not swallowed, and not fatal. A trade
          # worth stating plainly:
          #
          # The builder enforces thirteen published rules and exits non-zero
          # on any of them, so invalid rankings never publish. That part is
          # not optional and is not what this line decides. What it decides
          # is whether a rankings data problem also stops the wire, the
          # projections and the deploy, and it should not -- the same
          # reasoning as the preflight step below.
          #
          # `::error::` rather than `|| true`: a silent skip is how a page
          # goes stale for a week and looks like a quiet news day. This puts
          # a red annotation on the run summary while the site still ships.
          # Drop the `||` clause to make a gate failure stop everything.
          python scripts/build_rankings.py \
            || echo "::error title=Rankings not published::build_rankings.py failed its validation gates. The published board is unchanged."

          python scripts/build_sos.py || true

          # Projections, from the committed workbook. site/nfl is gitignored
          # and rebuilt here, so a page built locally never reaches Netlify:
          # if this step does not run, the projections page does not exist in
          # production however many times it is built on a laptop.
          python scripts/build_projections.py \
                 data/projections.xlsx || true

          # Coaching. A flat file that changes when a staff does, so this is
          # cheap and keeps the page in the deploy rather than only on a
          # laptop -- site/nfl is gitignored and rebuilt here.
          python scripts/build_coaching.py || true
          python scripts/import_rushing.py --seasons 2025 \
                 --rbwr data/rbwr_2025.csv || true
          python scripts/build_ol_rb.py --season 2025 || true

          # What changed in the projections, from the workbook's own
          # Weekly Update tab. Skips itself when the tab is absent.
          python scripts/build_changes.py || true

          # Draft value. After the ADP import above, because it reads the
          # same canonical number the durability board does -- one figure
          # read twice rather than two that happen to agree today.
          python scripts/build_draft_value.py || true

          # College projections, from the frozen release under
          # data/college. Deliberately without `|| true`: the builder
          # verifies the release manifest against a pinned SHA, and
          # swallowing that failure would publish a release nobody
          # reviewed, which is the one thing the gate exists to stop.
          python scripts/build_college_projections.py

          # Unmatched paths fell through to the homepage, so a mistyped
          # URL rendered the front page under it and read as a soft 404.
          python scripts/build_404.py

          # Again, so the projection chips read the board that
          # was just rebuilt. Last, so the sitemap it writes includes
          # the college URLs added above.
          python scripts/build_pages.py --base https://lineupbeat.com


      # The database, banked whatever happened above.
      #
      # Directly after the step that writes it, and deliberately not at the
      # end of the job: beatwire.db only changes in the pipeline step, and
      # every minute between the work and the save is a minute a
      # cancellation can throw it away. `always()` runs on cancellation,
      # which is the case this exists for -- a killed run has already paid
      # the model for whatever it extracted before it died, and pipeline.py
      # commits per source, so there is always real work to keep.
      - name: Save the database, whatever happened
        if: always()
        uses: actions/cache/save@v4
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}

      # Publishes even if preflight warns, but records the verdict in the log
      # so a slow degradation shows up in run history instead of silently.
      - name: Preflight
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which provider reads X. Unset means twitterapi, so
          # removing this variable is the whole rollback.
          BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python -m beatwire.cli preflight --sport nfl

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Cloudflare Pages rather than Netlify. Netlify moved to credit
        # billing and ten deploys a day exhausted them, most shipping a
        # rebuilt page where nothing had changed. Pages allows 500 builds a
        # month and unlimited bandwidth free.
        # Create first, deploy second. Wrangler no longer creates a
        # Pages project on deploy -- it errors and suggests Workers -- and
        # creating one that exists is a harmless failure, so this is a
        # no-op on every run after the first.
        run: |
          # Folded and labelled, because it fails on every run after the
          # first with "A project with this name already exists" and prints
          # a full ERROR block to do it. That block is the loudest thing in
          # a failed log and it is never the reason the job failed, which
          # is exactly how it gets read as the cause.
          echo "::group::Ensure the Pages project exists (expected to fail once it does)"
          npx --yes wrangler@latest pages project create lineupbeat \
              --production-branch=main || true
          echo "::endgroup::"

          # The deploy itself gets three attempts.
          #
          # It failed with "A fetch request failed, likely due to a
          # connectivity issue" and then "fetch failed" -- the runner could
          # not reach the Cloudflare API. Nothing was wrong with the build:
          # the pages had been written, the gates had passed, and the whole
          # run was thrown away by one network blip on the last step.
          #
          # A Pages deploy creates a new deployment each time, so a retry
          # after a failed upload costs a deployment slot and nothing else.
          for attempt in 1 2 3; do
            if npx --yes wrangler@latest pages deploy site \
                 --project-name=lineupbeat --branch=main --commit-dirty=true; then
              echo "  deployed on attempt $attempt"
              exit 0
            fi
            echo "  attempt $attempt failed"
            # An `if`, not `[ ] && sleep`: the runner sets -e, and on the
            # last pass the test fails, the && short-circuits, and the loop
            # body exits non-zero before the message below is ever printed.
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          echo "  three attempts failed. The build is fine; the Cloudflare"
          echo "  API was not reachable. Re-run the job."
          exit 1
