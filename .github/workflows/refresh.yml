name: refresh beat feed

on:
  workflow_dispatch:

concurrency:
  group: refresh
  # Cancel a run that is still going when the next one is due.
  #
  # The cache only saves when a job finishes, so an overlapping run restores
  # a database from before the run ahead of it did any work -- it sees the
  # same articles as unseen and pays to extract them all over again. Better
  # to abandon the older run: the newer one covers the same feeds anyway.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # seen_items and the cursors are what stop us re-paying the model for
      # something already processed. Losing them costs real money.
      #
      # actions/cache only saves when the job SUCCEEDS. Runs were failing --
      # a spend cap, a preflight gate, a cancellation -- so the cache never
      # updated, every run restored an older database, and every run saw
      # three thousand items as new. Two consecutive runs an hour apart both
      # reported 2,970 new items, which no set of beat writers produces.
      # The restored cache was 38MB against a real database of 118MB.
      #
      # So: restore and save are split, and the save runs whatever happened.
      # A run that fails halfway has still fetched things, and throwing that
      # away is what made the next run expensive.
      - uses: actions/cache/restore@v4
        id: dbcache
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}
          restore-keys: beatwire-db-

      - name: Gates
        run: |
          python scripts/test_resolve.py
          python -m beatwire.cli doctor --sport nfl

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # Skip items mentioning no skill player: 61% of new
          # items, none of which a default reader would see.
          BEATWIRE_SKILL_ONLY: "1"
        run: |
          # Rosters first, once a day.
          #
          # The wire always knows before the roster does -- that is the point
          # of reading beat writers -- so a player who signs today is
          # unresolvable until Sleeper catches up. Stefon Diggs signed with
          # Washington and five reports about him carried no position, so the
          # skill filter dropped him and his video never showed, on the one
          # day anybody wanted it.
          if [ "$(date -u +%H)" -lt 12 ]; then
            python scripts/import_rosters.py nfl || true
            python scripts/import_adp.py || true
            python scripts/import_depth.py --season 2026 || true
          fi


          # Historical tables for the durability page. A no-op once
          # they exist; they were in the once-a-day block, so an
          # afternoon run had no weekly_stats and the page skipped.
          python scripts/ensure_tables.py || true

          python -m beatwire.cli run    --sport nfl

          # Everything still unmatched gets another try against the roster as
          # it stands now. No model call, so this is free.
          python scripts/reresolve.py --sport nfl || true

          # Drop stored claims about players the wire does not show.
          #
          # The skill filter stops new extraction; it does nothing about the
          # backlog. This clears it, and errs everywhere toward keeping: an
          # unmatched player stays, an unknown position stays, a claim whose
          # source also names a receiver stays, and nothing under three days
          # old is touched at all -- because a man who signed this morning
          # is unresolvable until the roster catches up.
          #
          # Once a day is enough. It only ever has three days of backlog.
          if [ "$(date -u +%H)" -lt 12 ]; then
            python scripts/prune_positions.py --apply || true
          fi
          python -m beatwire.cli export --sports nfl --limit 4000 \
                 --out site/data/feed.json --site site/index.html
          # Crawlable pages. The app is one hash-routed URL with no words in
          # the markup; these give search engines a real address per player
          # with the reporting already in the HTML.
          python scripts/build_pages.py --base https://lineupbeat.com

      # Publishes even if preflight warns, but records the verdict in the log
      # so a slow degradation shows up in run history instead of silently.
      - name: Preflight
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m beatwire.cli preflight --sport nfl

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --dir=site --prod

      # Always. Even if a step above failed.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: beatwire.db
          key: beatwire-db-${{ github.run_id }}
