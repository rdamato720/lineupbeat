name: Wire facts-only dark launch

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Evidence lookback in hours (1-48)"
        required: true
        default: "24"

concurrency:
  group: wire-facts-dark-launch
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      BEATWIRE_X_PROVIDER: ${{ vars.BEATWIRE_X_PROVIDER }}
      SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      TAPI_DAILY_CAP: ${{ vars.WIRE_MOBILE_TAPI_DAILY_CAP_USD }}
      FACTS_HOURS: ${{ inputs.hours }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            wire-facts-x.db
            wire-facts-state.json
          key: wire-facts-state-${{ github.run_id }}
          restore-keys: wire-facts-state-
      - name: Validate isolated limits
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal
          hours = float(os.environ["FACTS_HOURS"])
          x_cap = Decimal(os.environ["TAPI_DAILY_CAP"])
          assert 1 <= hours <= 48
          assert Decimal("0") < x_cap <= Decimal("25")
          print(f"facts-only dark launch: {hours}h; 0 model calls")
          PY
      - name: Offline facts-only gates
        run: |
          python scripts/test_wire_facts.py
          python scripts/test_wire_mobile.py
          python scripts/wire_health.py --check
      - name: Capture trusted source evidence
        run: |
          python scripts/wire_backfill.py --discover --report --hours "$FACTS_HOURS"
          python scripts/wire_extract.py --limit 3000
          python scripts/wire_inclusive_review.py --hours "$FACTS_HOURS"
          python -m beatwire.cli --db wire-facts-x.db run --sport nfl \
            --kind twitterapi --capture-only --tapi-daily-cap "$TAPI_DAILY_CAP"
      - name: Extract exact named facts
        run: |
          python scripts/wire_facts_draft.py --hours "$FACTS_HOURS" \
            --state wire-facts-state.json
          python scripts/wire_facts_inbox.py
      - name: Upload exact review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wire-facts-dark-${{ github.run_id }}
          path: |
            data/wire_facts_dark_batch.json
            data/wire_facts_dark_inbox.md
          if-no-files-found: error
      - name: Open review-only issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create wire-facts-dark --color 15803d \
            --description "Facts-only review; cannot publish" --force
          gh issue create --title "Wire facts-only dark launch — run ${{ github.run_number }}" \
            --body-file data/wire_facts_dark_inbox.md --label wire-facts-dark \
            --assignee rdamato720
      - name: Save isolated facts-only cursors
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            wire-facts-x.db
            wire-facts-state.json
          key: wire-facts-state-${{ github.run_id }}
