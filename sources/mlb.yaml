# MLB source registry - GENERATED by scripts/build_registry.py
#
# Regenerating replaces the `sources` list and preserves `profile`.
#
# URLs come from two verified patterns (SB Nation /rss/index.xml and
# MLB.com /feeds/news/rss.xml), NOT from a live check of each one. Feeds rot.
# Before trusting any of this:
#
#   python -m beatwire.cli doctor --sport mlb
#   python -m beatwire.cli verify --sport mlb --fix
#
# The disabled `-local` entries are the hand-research slots: one local daily
# or beat podcast per team. Filling those in is the single highest-value
# manual task in this project, and the one worth paying someone to do.

profile:
  display: MLB
  positions:
  - SP
  - RP
  - P
  - C
  - 1B
  - 2B
  - 3B
  - SS
  - LF
  - CF
  - RF
  - OF
  - DH
  - IF
  - UT
  position_groups:
    P:
    - SP
    - RP
    - P
    SP:
    - SP
    - P
    RP:
    - RP
    - P
    IF:
    - 1B
    - 2B
    - 3B
    - SS
    - IF
    - UT
    OF:
    - LF
    - CF
    - RF
    - OF
    C:
    - C
  high_value:
  - the posted lineup, especially batting order position
  - a player out of the lineup and why
  - bullpen availability and closer or high-leverage role changes
  - probable pitcher changes and rotation shuffles
  - IL placements, activations, and rehab assignment timelines
  - callups, options, and DFA
  low_value:
  - postgame quotes about approach or confidence
  - milestone and streak notes with no roster implication
  - clubhouse mood pieces
  notes: 'Lineups are posted roughly three to four hours before first pitch and are worthless after it.
    Treat batting order position as usage, not context: moving from seventh to leadoff is a real change
    in expected plate appearances. Bullpen roles are described euphemistically, so "we will mix and match"
    is a closer committee and should be extracted as one. Rehab assignment locations and dates matter
    more than vague return talk.

    '
