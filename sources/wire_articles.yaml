  # --------------------------------------------- DISCOVERY_ONLY_PAID
  #
  # The Athletic. The reporting is good and it is not ours to take. This
  # entry exists so a human researching a team has the link, and for no
  # other reason: no body fetch, no cookies, no reader mode, no archive
  # mirror, no reconstruction from excerpts, and no claim built from a
  # headline. Manual URL submission does not lift any of that -- a
  # subscription wall refuses a person exactly as firmly as a fetcher.
  #
  # Enforced in three places, not one: Source.paid blocks manual_ok and
  # pollable, capture refuses the fetch, and the extractor refuses the
  # source. Every item is labelled PAID_SUBSCRIPTION_REQUIRED.

  - source_id: the_athletic_nfl
    source_name: The Athletic
    reporter_name: ''
    teams: [ALL]
    formats: [article]
    domains: [nytimes.com, theathletic.com]
    source_class: DISCOVERY_ONLY_PAID
    source_ownership: INDEPENDENT
    status: DISCOVERY_ONLY_PAID
    reporting_type: LOCAL_BEAT
    discovery: paid_metadata_only
    landing_page: https://www.nytimes.com/athletic/nfl/
    feed_scope: publication
    active: false
    trust_tier: 3
    blocked_reason: >-
      Subscription required. Discovery and external linking only; the
      article body may never be fetched, extracted, reconstructed or
      submitted by hand. Never AUTO_READY, never a countable full-text
      source.


