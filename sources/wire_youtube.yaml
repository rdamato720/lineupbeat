# Wire YouTube sources. Editorial Wire only -- reads no fantasy data.
#
# Every channel_id here was resolved from the channel page and then checked
# against what the channel has actually uploaded. A handle is not proof:
# @PHLYEagles resolves to a personal account called "Craig S" posting travel
# videos, and three other plausible handles 404 outright. Verified 2026-08-20.
#
# WHAT THE PROBE FOUND, AND WHY THE RULES BELOW EXIST
#
# Thirty videos across ten channels produced twenty-four transcripts and
# ZERO manual captions. Every one is auto-generated, so the stricter tier is
# not an exception here, it is the normal case: names get misheard, negation
# is lost, numbers move.
#
# A transcript also carries no speaker labels. On "Bucs DT Vita Vea Speaks!"
# the reporter's questions and Vea's answers are one undifferentiated stream.
# So speaker identity is decided by video FORMAT, never inferred from
# context, and anything that is not plainly one approved voice goes to a
# human. No diarization in V1: another uncertain model between the video and
# the Wire is the opposite of what this is for.
#
# THE ACCESS PROBLEM, MEASURED
#
# Transcripts are rate-limited by IP and the ceiling is low. A probe of 30
# videos returned 24 transcripts; a run of roughly 15 more, minutes later,
# returned IpBlocked on every single request from the same residential
# address, and was still blocked three minutes on. So this is not a
# datacenter-versus-home problem -- it is a volume problem, and 40-odd
# caption requests in an hour is past the line.
#
# What that means for the shape of V1: YouTube cannot be polled like RSS. It
# has to be a small number of deliberately chosen videos, spaced out, run by
# hand. The registry below is correct and the code works; what is not
# available is unlimited access to captions.
#
# speaker_mode
#   SINGLE_VOICE   one approved reporter talking: camp report, notebook,
#                  diary, takeaways. Eligible for automatic candidates.
#   MULTI_SPEAKER  interview, press conference, panel, call-in, members Q&A.
#                  Candidates are created but always MANUAL_REVIEW_ONLY.
#   UNCERTAIN      anything the title does not clearly place. Treated as
#                  MULTI_SPEAKER, because guessing is the failure mode.

defaults:
  transcript_languages: [en]
  # Below this a "transcript" is a caption on a highlight clip, not a report.
  # NewOrleans.Football's three most recent ran 168, 289 and 360 characters.
  min_transcript_chars: 1500
  # Auto-generated captions are the only kind these channels publish.
  allowed_transcript_sources: [MANUAL_CAPTIONS, AUTO_CAPTIONS]

# Titles that mean more than one person is talking. Checked before anything
# else, and deliberately broad -- a false MULTI costs a review, a false
# SINGLE puts a player's words in a reporter's mouth.
multi_speaker_patterns:
  - "\\binterview\\b"
  - "press conference|presser"
  - "\\bq ?& ?a\\b|\\bmailbag\\b|call-?in"
  - "\\bpanel\\b|roundtable|crossover"
  - "\\bspeaks\\b|\\bon facing\\b|breaks down his\\b"
  - "\\bwith\\b .*\\bjoins\\b|\\bjoins\\b"
  - "\\bvs\\.? \\w+ podcast\\b|\\bdebate\\b"

# Titles that mean one approved voice, reporting what he saw.
single_voice_patterns:
  - "camp report|training camp report"
  - "notebook|camp diary|diary"
  - "takeaways|observations|practice notes"
  - "what i saw|film room|film review"

