name = "lineupbeat-scores"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "scores.lineupbeat.com"
custom_domain = true

[[durable_objects.bindings]]
name = "SCORE_CACHE"
class_name = "ScoreCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScoreCache"]
